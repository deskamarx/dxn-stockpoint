org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Compile inside the Gradle daemon. The separate Kotlin daemon cannot always
# open a local socket (sandboxed terminals), and the fallback costs a minute
# every build.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

# Shared app version. Override on the command line with -Pdxn.versionCode / -Pdxn.versionName.
dxn.versionCode=11
dxn.versionName=3.1.2

# Default API endpoint baked into both apps at build time. Override with
# -Pdxn.apiBaseUrl=https://api.your-domain.com/ (the deploy scripts do this).
dxn.apiBaseUrl=https://shop.example.com/
