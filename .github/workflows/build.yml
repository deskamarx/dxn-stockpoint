name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      APP_VERSION: '3.1.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dxn-release.jks"
          echo "DXN_KEYSTORE=$RUNNER_TEMP/dxn-release.jks" >> "$GITHUB_ENV"

      - name: Build debug + release + bundle
        working-directory: android/DXNStockpoint
        env:
          DXN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DXN_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DXN_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect artefacts
        run: |
          set -e
          mkdir -p dist
          cp android/DXNStockpoint/app/build/outputs/apk/debug/app-debug.apk \
             dist/dxn-stockpoint-${APP_VERSION}-debug.apk
          # Signed release only exists once the keystore secrets are configured.
          if [ -f android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/DXNStockpoint/app/build/outputs/apk/release/app-release.apk \
               dist/dxn-stockpoint-${APP_VERSION}.apk
            # `latest` should always be the signed build, never the debug one.
            cp dist/dxn-stockpoint-${APP_VERSION}.apk dist/dxn-stockpoint-latest.apk
          else
            cp dist/dxn-stockpoint-${APP_VERSION}-debug.apk dist/dxn-stockpoint-latest.apk
          fi
          cp android/DXNStockpoint/app/build/outputs/bundle/release/app-release.aab \
             dist/dxn-stockpoint-${APP_VERSION}.aab
          ls -lh dist

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-${APP_VERSION}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v3.1.1' }}
          name: DXN Stockpoint v3.1.1 - Fixed Default API Server
          overwrite_files: true
          body: |
            ## DXN Stockpoint v3.1.1

            **Fixed**: default API moved off the dead `dxn.infy.click` host to the live
            API `https://dxn.10001mb.com`. Old installs auto-migrate on first launch.

            **Features**: customer accounts (register/login/profile/orders/tracking),
            owner PIN admin panel, offline-first sync, 52-SKU DXN price list.

            **Install the APK:** `dxn-stockpoint-3.1.1.apk` (signed; if absent,
            the `-debug` build sideloads the same way).

            **Web suite:** https://deskamarx.github.io/dxn-stockpoint/suite.html
            **Live API:** https://dxn.10001mb.com/api/v1/health
            3. Unlock Admin with the shop PIN to manage stock and orders
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
