name: Build & verify

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'server/**'
      - 'docs/**'
      - 'deploy/**'
      - 'package.json'
      - '.github/workflows/build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'android/**'
      - 'server/**'
      - 'docs/**'
      - 'package.json'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API URL baked into release builds (blank uses vars.DXN_API_URL)'
        required: false
        default: ''
      release:
        description: 'Build signed release APKs/AABs'
        type: boolean
        default: false
      allow_placeholder:
        description: 'Allow the placeholder API (configurable in-app) for this run'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: npm run check

  android:
    name: Android apps
    runs-on: ubuntu-latest
    env:
      OWNER_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      CLIENT_KEYSTORE_BASE64: ${{ secrets.ANDROID_CLIENT_KEYSTORE_BASE64 }}
      DXN_API_URL: ${{ inputs.api_url || vars.DXN_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          code=$(grep '^dxn.versionCode=' android/DXNStockpoint/gradle.properties | cut -d= -f2)
          name=$(grep '^dxn.versionName=' android/DXNStockpoint/gradle.properties | cut -d= -f2)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Restore owner key
        if: env.OWNER_KEYSTORE_BASE64 != ''
        run: |
          echo "$OWNER_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/owner.jks"
          echo "DXN_KEYSTORE=$RUNNER_TEMP/owner.jks" >> "$GITHUB_ENV"
          echo "DXN_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DXN_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "DXN_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Restore customer key
        if: env.CLIENT_KEYSTORE_BASE64 != ''
        run: |
          echo "$CLIENT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/client.jks"
          echo "DXN_CLIENT_KEYSTORE=$RUNNER_TEMP/client.jks" >> "$GITHUB_ENV"
          echo "DXN_CLIENT_KEYSTORE_PASSWORD=${{ secrets.ANDROID_CLIENT_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "DXN_CLIENT_KEY_ALIAS=${{ secrets.ANDROID_CLIENT_KEY_ALIAS || 'dxn-client' }}" >> "$GITHUB_ENV"
          echo "DXN_CLIENT_KEY_PASSWORD=${{ secrets.ANDROID_CLIENT_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build debug APKs
        working-directory: android/DXNStockpoint
        run: ./scripts/build-apps.sh --debug

      - name: Build owner release
        if: env.OWNER_KEYSTORE_BASE64 != '' && (env.DXN_API_URL != '' || inputs.allow_placeholder) && (github.event_name != 'workflow_dispatch' || inputs.release)
        working-directory: android/DXNStockpoint
        run: |
          FLAGS=""
          if [ -z "$DXN_API_URL" ]; then FLAGS="--allow-placeholder"; fi
          ./scripts/build-apps.sh --release --aab --owner-only $FLAGS

      - name: Build customer release
        if: env.CLIENT_KEYSTORE_BASE64 != '' && (env.DXN_API_URL != '' || inputs.allow_placeholder) && (github.event_name != 'workflow_dispatch' || inputs.release)
        working-directory: android/DXNStockpoint
        run: |
          FLAGS=""
          if [ -z "$DXN_API_URL" ]; then FLAGS="--allow-placeholder"; fi
          ./scripts/build-apps.sh --release --aab --client-only $FLAGS

      - name: Verify release signatures
        if: (env.DXN_API_URL != '' || inputs.allow_placeholder) && (env.OWNER_KEYSTORE_BASE64 != '' || env.CLIENT_KEYSTORE_BASE64 != '') && (github.event_name != 'workflow_dispatch' || inputs.release)
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          shopt -s nullglob
          for apk in dist/android/*.apk; do
            case "$apk" in
              *debug*) continue ;;
            esac
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dxn-stockpoint-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            dist/android/*.apk
            dist/android/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub release
        if: (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && env.OWNER_KEYSTORE_BASE64 != '' && (env.DXN_API_URL != '' || inputs.allow_placeholder) && (github.event_name != 'workflow_dispatch' || inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.name) }}
          name: DXN Stockpoint v${{ steps.version.outputs.name }}
          overwrite_files: true
          body: |
            ## DXN Stockpoint v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})

            Two dedicated apps:

            - **Owner** `com.dxn.stockpoint` — POS, stock, orders, admin panel.
            - **Customer** `com.dxn.stockpoint.client` — catalogue, cart, account, order tracking.

            Both are signed release builds when the repository signing secrets are
            configured. Install the APK that matches the device role.

            API origin: ${{ env.DXN_API_URL != '' && env.DXN_API_URL || 'placeholder — open Settings → Server and paste your shop API origin (https://your-domain/ or http://<shop-pc-ip>:4173)' }}

            Web app: https://deskamarx.github.io/dxn-stockpoint/
            Suite: https://deskamarx.github.io/dxn-stockpoint/suite.html
            One server powers all three; sales, stock and orders share the same revision feed.
          files: |
            dist/android/*.apk
            dist/android/*.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
